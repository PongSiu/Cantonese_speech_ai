{% extends "base.html" %}

{% block content %}
<div class="flex flex-col h-[calc(100vh-2rem)] max-w-4xl mx-auto rounded-3xl overflow-hidden border-4 border-gray-800 bg-gray-900 relative">

    <!-- Background Scene (Dungeon) -->
    <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>

    <!-- Header -->
    <div class="p-4 flex justify-between items-center z-10 bg-gray-800/80 backdrop-blur border-b-4 border-gray-900">
      <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-game-blue rounded-lg border-2 border-white flex items-center justify-center">
              <i data-lucide="sword" class="text-white w-6 h-6"></i>
          </div>
          <div>
              <h2 class="font-black text-white text-lg">{{ t('chat_title') }}</h2>
              <p class="text-xs text-game-green font-bold">● Online</p>
          </div>
      </div>
    </div>

    <!-- RPG Scene Area -->
    <div class="flex-1 relative p-6 overflow-hidden flex flex-col justify-end">
        <!-- Warrior Sprite -->
        <div class="absolute bottom-20 left-4 md:left-20 w-48 h-48 z-0">
             <img src="https://img.icons8.com/?size=100&id=rrc6klXbnGxP&format=png&color=000000" class="w-full h-full object-contain animate-bounce-slow drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">
        </div>

        <!-- Chat Bubble Container -->
        <div id="chat-box" class="z-10 space-y-4 max-h-[60vh] overflow-y-auto p-4 no-scrollbar pb-20">
            <!-- Initial Bot Message -->
            <div class="flex items-start gap-4">
                <div class="w-12 h-12 bg-white rounded-full border-2 border-gray-300 flex items-center justify-center shrink-0 overflow-hidden">
                     <img src="https://img.icons8.com/color/48/knight-helmet.png" class="w-8 h-8">
                </div>
                <div class="max-w-[80%] p-4 rounded-3xl rounded-bl-none text-lg leading-relaxed bg-white text-gray-800 shadow-lg border-4 border-gray-200">
                    <p class="font-bold">{{ t('chat_greeting') }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Input Area (Mic Button) -->
    <div class="p-6 bg-gray-800 border-t-4 border-gray-900 z-20 flex flex-col items-center justify-center">
      <button id="mic-btn" class="w-24 h-24 rounded-full bg-game-blue border-b-8 border-blue-600 flex items-center justify-center text-white shadow-xl active:border-b-0 active:translate-y-2 transition-all hover:bg-blue-400">
          <i data-lucide="mic" class="w-10 h-10"></i>
      </button>
      <div id="status-text" class="mt-3 text-gray-400 text-sm font-bold">{{ t('chat_hold_to_speak') }}</div>
    </div>
</div>

<script>
const _t = {
    recording: {{ t('chat_recording')|tojson }},
    processing: {{ t('chat_processing')|tojson }},
    send_fail: {{ t('chat_send_fail')|tojson }},
    hold_to_speak: {{ t('chat_hold_to_speak')|tojson }},
    sending: {{ t('chat_sending')|tojson }},
};

let mediaRecorder;
let audioChunks = [];
let isRecording = false;

let currentTopic = "冒險開始";
let currentMissionWords = ["開心", "朋友"];
let chatHistory = "Bot: 你好，冒險者！";

const micBtn = document.getElementById('mic-btn');
const statusText = document.getElementById('status-text');

micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('mouseleave', stopRecording);

micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

async function startRecording() {
    if (isRecording) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = sendAudio;

        mediaRecorder.start();
        isRecording = true;

        micBtn.classList.remove('bg-game-blue', 'border-blue-600');
        micBtn.classList.add('bg-red-500', 'border-red-700', 'animate-pulse');
        statusText.innerText = _t.recording;
        statusText.classList.add('text-red-400');

    } catch (err) {
        alert("Mic Error: " + err);
    }
}

function stopRecording() {
    if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;

        micBtn.classList.add('bg-game-blue', 'border-blue-600');
        micBtn.classList.remove('bg-red-500', 'border-red-700', 'animate-pulse');
        statusText.innerText = _t.processing;
        statusText.classList.remove('text-red-400');
    }
}

async function sendAudio() {
    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });

    addBubble('user', _t.sending);

    const formData = new FormData();
    formData.append('audio', audioBlob);

    formData.append('topic', currentTopic);
    formData.append('history', chatHistory);
    formData.append('current_mission_words', JSON.stringify(currentMissionWords));

    try {
        const res = await fetch('/api/mission_chat_process', { method: 'POST', body: formData });
        const data = await res.json();

        const bubbles = document.getElementById('chat-box').children;
        const lastBubble = bubbles[bubbles.length - 1];
        lastBubble.querySelector('.font-bold').innerText = `"${data.transcript}"`;

        setTimeout(() => addBubble('bot', data.bot_reply), 500);

        chatHistory += `\nUser: ${data.transcript}\nBot: ${data.bot_reply}`;
        if (data.next_mission_words) currentMissionWords = data.next_mission_words;

        statusText.innerText = _t.hold_to_speak;

    } catch (e) {
        console.error(e);
        statusText.innerText = _t.send_fail;
    }
}

function addBubble(role, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');

    if (role === 'user') {
        div.className = "flex items-center justify-end gap-3 mb-4";
        div.innerHTML = `
            <div class="max-w-[70%] p-4 rounded-3xl rounded-br-none text-lg font-bold bg-game-blue text-white shadow-lg border-4 border-blue-600">
                <p class="font-bold">${text}</p>
            </div>
            <div class="w-12 h-12 bg-blue-200 rounded-full border-2 border-white flex items-center justify-center shrink-0">
                 <span class="font-black text-blue-600">YOU</span>
            </div>
        `;
    } else {
        div.className = "flex items-start gap-3 mb-4";
        div.innerHTML = `
            <div class="w-12 h-12 bg-white rounded-full border-2 border-gray-300 flex items-center justify-center shrink-0 overflow-hidden">
                 <img src="https://img.icons8.com/color/48/knight-helmet.png" class="w-8 h-8">
            </div>
            <div class="max-w-[80%] p-4 rounded-3xl rounded-bl-none text-lg font-bold bg-white text-gray-800 shadow-lg border-4 border-gray-200">
                <p class="font-bold">${text}</p>
            </div>
        `;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
lucide.createIcons();
</script>
{% endblock %}
