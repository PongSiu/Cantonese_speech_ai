<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('login_btn') }} - TheraLingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Zen Maru Gothic', sans-serif; }</style>
</head>
<body class="bg-[#fdfcf5] min-h-screen flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div class="w-full max-w-md space-y-4">

        <!-- Logo -->
        <div class="text-center mb-2">
            <div class="w-16 h-16 bg-game-green rounded-2xl mx-auto mb-3 flex items-center justify-center shadow-lg" style="background:#58cc02;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1 class="text-3xl font-black text-gray-800">TheraLingua</h1>
            <p class="text-gray-400 font-bold text-sm mt-1">{{ t('login_subtitle') }}</p>
        </div>

        <!-- Role Tabs -->
        <div class="bg-gray-100 p-1 rounded-2xl flex gap-1">
            <button id="tab-client" onclick="switchRole('client')"
                class="flex-1 py-3 rounded-xl font-black text-sm transition-all bg-white text-blue-600 shadow-sm flex items-center justify-center gap-2">
                {{ t('login_student_tab') }}
            </button>
            <button id="tab-therapist" onclick="switchRole('therapist')"
                class="flex-1 py-3 rounded-xl font-black text-sm transition-all text-gray-500 flex items-center justify-center gap-2">
                {{ t('login_therapist_tab') }}
            </button>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-3xl shadow-xl p-8 border-b-8 transition-all duration-300" id="login-card"
             style="border-color: #3b82f6;">

            <div class="text-center mb-6">
                <div id="role-icon" class="text-5xl mb-2">🎮</div>
                <h2 class="text-2xl font-black text-gray-800" id="role-title">{{ t('login_student_title') }}</h2>
                <p class="text-gray-400 font-bold text-sm mt-1" id="role-desc">{{ t('login_student_desc') }}</p>
            </div>

            {% if error %}
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded-xl font-bold">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <input type="hidden" name="role_hint" id="role-hint" value="client">

                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('login_email') }}</label>
                    <input required type="email" name="email"
                           class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 transition-colors"
                           id="email-input" style="focus-border-color:#3b82f6;"
                           placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('login_password') }}</label>
                    <div class="relative">
                        <input required type="password" name="password" id="pw-input"
                               class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 transition-colors pr-12"
                               placeholder="••••••••">
                        <button type="button" onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg id="pw-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full text-white font-black py-4 rounded-xl shadow-lg border-b-4 active:border-b-0 active:translate-y-1 transition-all mt-2 text-lg"
                    style="background:#3b82f6; border-color:#1d4ed8;">
                    {{ t('login_btn') }}
                </button>
            </form>

            <!-- Therapist hint -->
            <div id="therapist-note" class="hidden mt-4 bg-teal-50 border border-teal-200 rounded-xl p-3 text-center">
                <p class="text-teal-700 font-bold text-sm">{{ t('login_no_therapist') }}</p>
                <a href="/register?role=therapist" class="text-teal-600 text-xs font-black underline underline-offset-2 mt-1 inline-block">
                    {{ t('login_create_therapist') }}
                </a>
            </div>
        </div>

        <!-- Register link (clients only) -->
        <div id="register-section" class="bg-white rounded-2xl p-5 text-center shadow-sm border border-gray-100">
            <p class="text-gray-500 font-bold mb-3 text-sm">{{ t('login_no_account') }}</p>
            <a href="/register"
                class="inline-block w-full bg-green-100 text-green-700 font-black py-3 rounded-xl hover:bg-green-200 transition-colors">
                {{ t('login_create_student') }}
            </a>
        </div>

    </div>

<script>
    const roleConfig = {
        client: {
            icon: '🎮',
            title: '{{ t("login_student_title") }}',
            desc: '{{ t("login_student_desc") }}',
            cardBorder: '#3b82f6',
            btnBg: '#3b82f6',
            btnBorder: '#1d4ed8',
            tabActive: 'bg-white text-blue-600 shadow-sm',
            tabInactive: 'text-gray-500',
        },
        therapist: {
            icon: '🩺',
            title: '{{ t("login_therapist_title") }}',
            desc: '{{ t("login_therapist_desc") }}',
            cardBorder: '#10b981',
            btnBg: '#10b981',
            btnBorder: '#059669',
            tabActive: 'bg-white text-green-600 shadow-sm',
            tabInactive: 'text-gray-500',
        }
    };

    let currentRole = 'client';

    function switchRole(role) {
        currentRole = role;
        const cfg = roleConfig[role];
        const other = role === 'client' ? 'therapist' : 'client';
        const otherCfg = roleConfig[other];

        // Update tabs
        document.getElementById('tab-' + role).className =
            `flex-1 py-3 rounded-xl font-black text-sm transition-all flex items-center justify-center gap-2 ${cfg.tabActive}`;
        document.getElementById('tab-' + other).className =
            `flex-1 py-3 rounded-xl font-black text-sm transition-all flex items-center justify-center gap-2 ${otherCfg.tabInactive}`;

        // Update card
        document.getElementById('role-icon').textContent = cfg.icon;
        document.getElementById('role-title').textContent = cfg.title;
        document.getElementById('role-desc').textContent = cfg.desc;
        document.getElementById('login-card').style.borderColor = cfg.cardBorder;
        document.getElementById('submit-btn').style.background = cfg.btnBg;
        document.getElementById('submit-btn').style.borderColor = cfg.btnBorder;
        document.getElementById('role-hint').value = role;

        // Show/hide therapist note and register section
        document.getElementById('therapist-note').classList.toggle('hidden', role !== 'therapist');
        document.getElementById('register-section').classList.toggle('hidden', role === 'therapist');
    }

    function togglePw() {
        const input = document.getElementById('pw-input');
        input.type = input.type === 'password' ? 'text' : 'password';
    }
</script>
</body>
</html>
