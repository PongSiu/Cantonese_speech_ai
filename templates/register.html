<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('reg_student_title') }} - TheraLingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Zen Maru Gothic', sans-serif; }</style>
</head>
<body class="bg-[#fdfcf5] min-h-screen flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div class="w-full max-w-md space-y-4">

        <!-- Logo -->
        <div class="text-center">
            <h1 class="text-2xl font-black text-gray-700">TheraLingua</h1>
        </div>

        <!-- Role Tabs -->
        <div class="bg-gray-100 p-1 rounded-2xl flex gap-1">
            <button id="tab-client" onclick="switchRole('client')"
                class="flex-1 py-3 rounded-xl font-black text-sm transition-all bg-white text-green-600 shadow-sm flex items-center justify-center gap-2">
                {{ t('reg_student_tab') }}
            </button>
            <button id="tab-therapist" onclick="switchRole('therapist')"
                class="flex-1 py-3 rounded-xl font-black text-sm transition-all text-gray-500 flex items-center justify-center gap-2">
                {{ t('reg_therapist_tab') }}
            </button>
        </div>

        <!-- Register Card -->
        <div class="bg-white rounded-3xl shadow-xl p-8 border-b-8 relative overflow-hidden transition-all duration-300"
             id="register-card" style="border-color:#22c55e;">
            <div class="absolute top-0 left-0 w-full h-2 transition-colors duration-300" id="top-bar" style="background:#22c55e;"></div>

            <div class="text-center mb-6">
                <div id="role-icon" class="text-4xl mb-2">🌱</div>
                <h2 class="text-2xl font-black text-gray-800" id="role-title">{{ t('reg_student_title') }}</h2>
                <p class="text-gray-500 font-bold text-sm mt-1" id="role-desc">{{ t('reg_student_desc') }}</p>
            </div>

            {% if error %}
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded-xl font-bold">
                {{ error }}
            </div>
            {% endif %}

            <form action="/register" method="POST" class="space-y-4">
                <input type="hidden" name="role" id="role-input" value="client">

                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_last_name') }}</label>
                        <input required type="text" name="last_name" placeholder="{{ t('reg_last_name_ph') }}"
                               class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 text-sm">
                    </div>
                    <div class="flex-1">
                        <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_first_name') }}</label>
                        <input required type="text" name="first_name" placeholder="{{ t('reg_first_name_ph') }}"
                               class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_phone') }}</label>
                    <input required type="tel" name="phone" placeholder="{{ t('reg_phone_ph') }}"
                           class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 text-sm">
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_email') }}</label>
                    <input required type="email" name="email" placeholder="user@gmail.com"
                           class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 text-sm">
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_password') }}</label>
                    <div class="relative">
                        <input id="password-input" required type="password" name="password" minlength="8" placeholder="••••••••"
                               class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 pr-12 text-sm">
                        <button type="button" onclick="togglePassword('password-input', this)"
                                class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600">
                            <i data-lucide="eye" class="w-5 h-5 eye-on"></i>
                            <i data-lucide="eye-off" class="w-5 h-5 eye-off hidden"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_confirm_pw') }}</label>
                    <div class="relative">
                        <input id="confirm-password-input" required type="password" name="confirm_password" minlength="8" placeholder="{{ t('reg_confirm_pw_ph') }}"
                               class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none font-bold text-gray-700 pr-12 text-sm">
                        <button type="button" onclick="togglePassword('confirm-password-input', this)"
                                class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600">
                            <i data-lucide="eye" class="w-5 h-5 eye-on"></i>
                            <i data-lucide="eye-off" class="w-5 h-5 eye-off hidden"></i>
                        </button>
                    </div>
                </div>

                <!-- Language Preference -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_language') }}</label>
                    <div class="flex gap-2">
                        <button type="button" onclick="setLang('zh')" id="lang-btn-zh"
                            class="flex-1 py-3 rounded-xl font-black text-sm transition-all border-2 flex items-center justify-center gap-2 bg-blue-50 border-blue-400 text-blue-700">
                            {{ t('reg_lang_zh') }}
                        </button>
                        <button type="button" onclick="setLang('en')" id="lang-btn-en"
                            class="flex-1 py-3 rounded-xl font-black text-sm transition-all border-2 flex items-center justify-center gap-2 bg-white border-gray-200 text-gray-500">
                            {{ t('reg_lang_en') }}
                        </button>
                    </div>
                    <input type="hidden" name="preferred_language" id="lang-input" value="zh">
                    <p class="text-xs text-gray-400 font-bold mt-1">{{ t('reg_lang_hint') }}</p>
                </div>

                <!-- Therapist invite code (hidden by default) -->
                <div id="invite-code-field" class="hidden">
                    <label class="block text-gray-700 font-bold mb-2 text-sm">{{ t('reg_invite_code') }}</label>
                    <input id="invite-code-input" type="text" name="invite_code" placeholder="{{ t('reg_invite_code_ph') }}"
                           class="w-full px-4 py-3 bg-teal-50 border-2 border-teal-200 rounded-xl focus:outline-none font-black text-gray-700 tracking-widest text-center uppercase text-sm">
                    <p class="text-xs text-gray-400 font-bold mt-1">{{ t('reg_invite_hint') }}</p>
                </div>

                <!-- Client note -->
                <div id="client-note" class="bg-yellow-50 p-4 rounded-xl border border-yellow-200 text-sm text-yellow-800 font-bold flex gap-2">
                    <span>ℹ️</span>
                    <span>{{ t('reg_client_note') }}</span>
                </div>

                <!-- Therapist note -->
                <div id="therapist-note" class="hidden bg-teal-50 p-4 rounded-xl border border-teal-200 text-sm text-teal-800 font-bold flex gap-2">
                    <span>🩺</span>
                    <span>{{ t('reg_therapist_note') }}</span>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full text-white font-black py-4 rounded-xl shadow-lg border-b-4 active:border-b-0 active:translate-y-1 transition-all text-lg"
                    style="background:#22c55e; border-color:#15803d;">
                    {{ t('reg_student_btn') }}
                </button>
            </form>

            <div class="mt-6 text-center font-bold text-gray-500 text-sm">
                {{ t('reg_have_account') }} <a href="/login" class="text-green-500 hover:text-green-600 underline underline-offset-4">{{ t('reg_login_link') }}</a>
            </div>
        </div>

    </div>

<script>
    lucide.createIcons();

    const roles = {
        client: {
            icon: '🌱', title: '{{ t("reg_student_title") }}', desc: '{{ t("reg_student_desc") }}',
            color: '#22c55e', border: '#15803d',
            tabActive: 'bg-white text-green-600 shadow-sm', tabInactive: 'text-gray-500',
            btnText: '{{ t("reg_student_btn") }}'
        },
        therapist: {
            icon: '🩺', title: '{{ t("reg_therapist_title") }}', desc: '{{ t("reg_therapist_desc") }}',
            color: '#0d9488', border: '#0f766e',
            tabActive: 'bg-white text-teal-600 shadow-sm', tabInactive: 'text-gray-500',
            btnText: '{{ t("reg_therapist_btn") }}'
        }
    };

    function switchRole(role) {
        const cfg = roles[role];
        const other = role === 'client' ? 'therapist' : 'client';

        // Tabs
        document.getElementById('tab-' + role).className =
            `flex-1 py-3 rounded-xl font-black text-sm transition-all flex items-center justify-center gap-2 ${cfg.tabActive}`;
        document.getElementById('tab-' + other).className =
            `flex-1 py-3 rounded-xl font-black text-sm transition-all flex items-center justify-center gap-2 ${roles[other].tabInactive}`;

        // Card visuals
        document.getElementById('role-icon').textContent = cfg.icon;
        document.getElementById('role-title').textContent = cfg.title;
        document.getElementById('role-desc').textContent = cfg.desc;
        document.getElementById('register-card').style.borderColor = cfg.color;
        document.getElementById('top-bar').style.background = cfg.color;
        document.getElementById('submit-btn').style.background = cfg.color;
        document.getElementById('submit-btn').style.borderColor = cfg.border;
        document.getElementById('submit-btn').textContent = cfg.btnText;
        document.getElementById('role-input').value = role;

        // Toggle fields
        const isTherapist = role === 'therapist';
        document.getElementById('invite-code-field').classList.toggle('hidden', !isTherapist);
        document.getElementById('invite-code-input').required = isTherapist;
        document.getElementById('client-note').classList.toggle('hidden', isTherapist);
        document.getElementById('therapist-note').classList.toggle('hidden', !isTherapist);
    }

    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const eyeOn = button.querySelector('.eye-on');
        const eyeOff = button.querySelector('.eye-off');
        if (input.type === 'password') {
            input.type = 'text';
            eyeOn.classList.add('hidden');
            eyeOff.classList.remove('hidden');
        } else {
            input.type = 'password';
            eyeOn.classList.remove('hidden');
            eyeOff.classList.add('hidden');
        }
    }

    function setLang(lang) {
        document.getElementById('lang-input').value = lang;
        const zhBtn = document.getElementById('lang-btn-zh');
        const enBtn = document.getElementById('lang-btn-en');
        if (lang === 'zh') {
            zhBtn.className = 'flex-1 py-3 rounded-xl font-black text-sm transition-all border-2 flex items-center justify-center gap-2 bg-blue-50 border-blue-400 text-blue-700';
            enBtn.className = 'flex-1 py-3 rounded-xl font-black text-sm transition-all border-2 flex items-center justify-center gap-2 bg-white border-gray-200 text-gray-500';
        } else {
            enBtn.className = 'flex-1 py-3 rounded-xl font-black text-sm transition-all border-2 flex items-center justify-center gap-2 bg-blue-50 border-blue-400 text-blue-700';
            zhBtn.className = 'flex-1 py-3 rounded-xl font-black text-sm transition-all border-2 flex items-center justify-center gap-2 bg-white border-gray-200 text-gray-500';
        }
    }

    // Auto-switch tab if ?role=therapist in URL or server error on therapist form
    {% if error and request.form.get('role') == 'therapist' %}
    switchRole('therapist');
    {% endif %}
    if (new URLSearchParams(window.location.search).get('role') === 'therapist') {
        switchRole('therapist');
    }
</script>
</body>
</html>
